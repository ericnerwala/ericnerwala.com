    <div id="map"></div>

    <nav class="rail" aria-label="Main">
      <button class="rail-menu" type="button" aria-label="Menu">
        <svg class="icon"><use href="#i-menu" /></svg>
      </button>

      <button class="rail-ask" type="button">
        <span class="rail-ask-btn"><svg class="icon"><use href="#i-ask" /></svg></span>
        <span class="rail-label">Ask Maps</span>
      </button>

      <button id="saved" class="rail-item" type="button">
        <span class="rail-pill"><svg class="icon"><use href="#i-bookmark" /></svg></span>
        <span class="rail-label">Saved</span>
      </button>

      <button class="rail-item" type="button">
        <span class="rail-pill"><svg class="icon"><use href="#i-history" /></svg></span>
        <span class="rail-label">Recents</span>
      </button>

      <hr class="rail-rule" />

      <div class="rail-recents">
        <button id="recent-philly" class="recent recent--list" type="button">
          <span class="recent-thumb"><img src="./assets/thumbs/recent-1.jpg" alt="" /><b>34</b></span>
          <span class="rail-label">Philadelphia</span>
        </button>
        <button class="recent" type="button">
          <span class="recent-thumb"><img src="./assets/thumbs/recent-2.jpg" alt="" /></span>
          <span class="rail-label">Pittsburgh</span>
        </button>
        <button class="recent" type="button">
          <span class="recent-thumb"><img src="./assets/thumbs/recent-3.jpg" alt="" /></span>
          <span class="rail-label">21 South St</span>
        </button>
        <button class="recent" type="button">
          <span class="recent-more"><svg class="icon"><use href="#i-more_horiz" /></svg></span>
          <span class="rail-label">View more</span>
        </button>
      </div>

      <div class="rail-foot">
        <hr class="rail-rule" />
        <button class="rail-item" type="button">
          <span class="rail-pill"><svg class="icon"><use href="#i-mobile" /></svg></span>
          <span class="rail-label">Get app</span>
        </button>
      </div>
    </nav>

    <form class="omnibox" role="search" onsubmit="return false">
      <input
        id="q"
        type="text"
        placeholder="Search Eric Maps"
        aria-label="Search"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="omnibox-btn" type="submit" aria-label="Search">
        <svg class="icon"><use href="#i-search" /></svg>
      </button>
      <button class="omnibox-btn omnibox-directions" type="button" aria-label="Directions">
        <svg class="icon"><use href="#i-directions" /></svg>
      </button>
    </form>

    <div class="chips">
      <button class="chips-arrow chips-prev" type="button" aria-label="Previous" hidden>
        <svg class="icon"><use href="#i-chevron_left" /></svg>
      </button>
      <div class="chips-scroll">
        <button class="chip" type="button" data-cat="curiosity" aria-pressed="false"><svg class="icon"><use href="#i-spark" /></svg>Curiosity</button>
        <button class="chip" type="button" data-cat="interest" aria-pressed="false"><svg class="icon"><use href="#i-bookmark" /></svg>Interest</button>
        <button class="chip" type="button" data-cat="route" aria-pressed="false"><svg class="icon"><use href="#i-directions" /></svg>Route</button>
        <button class="chip" type="button" data-cat="movement" aria-pressed="false"><svg class="icon"><use href="#i-run" /></svg>Movement</button>
        <button class="chip" type="button" data-cat="travel" aria-pressed="false"><svg class="icon"><use href="#i-travel" /></svg>Travel</button>
      </div>
      <button class="chips-arrow chips-next" type="button" aria-label="Next">
        <svg class="icon"><use href="#i-chevron_right" /></svg>
      </button>
    </div>

    <div class="account">
      <button class="account-avatar" type="button" aria-label="Account">
        <img src="./assets/avatar.jpg?v=2" alt="Eric" />
      </button>
      <figure class="account-quote">
        <blockquote>
          <p>A map you have walked is different from a map you have only read.</p>
        </blockquote>
        <figcaption>Eric</figcaption>
      </figure>
    </div>

    <button class="layers" type="button" aria-label="Layers">
      <img src="./assets/thumbs/layers.jpg" alt="" />
      <span><svg class="icon"><use href="#i-layers" /></svg>Layers</span>
    </button>

    <div class="controls">
      <button id="locate" class="ctl" type="button" aria-label="Back to start">
        <svg class="icon"><use href="#i-my_location" /></svg>
      </button>
      <div class="ctl ctl-zoom">
        <button id="zoom-in" type="button" aria-label="Zoom in"><svg class="icon"><use href="#i-add" /></svg></button>
        <button id="zoom-out" type="button" aria-label="Zoom out"><svg class="icon"><use href="#i-remove" /></svg></button>
      </div>
      <div class="ctl ctl-views">
        <button class="views-pegman" type="button" aria-label="Street View">
          <svg class="icon"><use href="#i-pegman" /></svg>
        </button>
        <span class="views-thumbs">
          <img src="./assets/thumbs/view-1.jpg" alt="" />
          <img src="./assets/thumbs/view-2.jpg" alt="" />
          <img src="./assets/thumbs/view-3.jpg" alt="" />
        </span>
        <button class="views-more" type="button" aria-label="Show imagery">
          <svg class="icon"><use href="#i-double_up" /></svg>
        </button>
      </div>
    </div>

    <div class="wordmark" aria-hidden="true">Eric Maps</div>

    <div id="results" class="results" hidden></div>

    <aside id="story" class="story" hidden role="dialog" aria-modal="true" aria-labelledby="story-title">
      <div class="story-bar">
        <button id="story-back" type="button" hidden aria-label="All places">
          <svg class="icon"><use href="#i-chevron_left" /></svg>
        </button>
        <div class="story-head">
          <p id="story-kicker"></p>
          <h2 id="story-title"></h2>
          <p id="story-place" hidden></p>
        </div>
        <button id="story-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="story-body" class="story-body"></div>
    </aside>
    <div id="suggest" class="suggest" hidden></div>

    <footer class="foot">
      <span>Map data ©<span id="year">2026</span> <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></span>
      <a href="https://openmaptiles.org/">OpenMapTiles</a>
      <a href="https://openfreemap.org/">OpenFreeMap</a>
      <span>United States</span>
      <span class="scale"><span id="scale-label">10 mi</span><span id="scale-bar"></span></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>

  </body>
</html>
